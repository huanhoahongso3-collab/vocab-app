name: Build demo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_PUBLIC_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Generate Android project (package dhp.fatties.vocab)
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (demo: no login, no server)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vocab-demo-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
